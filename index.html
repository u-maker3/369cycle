<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5ede7"><title>みろく流｜2027年 運気だより</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f1ec;color:#403732;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.panel{background:white;border-radius:19px;padding:20px;box-shadow:0 4px 24px #70523a14;margin-bottom:16px}h1{font-size:23px;margin:0 0 8px}p{line-height:1.65}.sub{color:#81746e;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.fields label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}input,select{width:100%;font-size:16px;padding:12px;border:1px solid #d8c9c0;border-radius:10px;background:white}button{border:0;border-radius:99px;padding:13px 19px;background:#776b54;color:white;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#f2e7dc;color:#54473d}.actions{display:flex;flex-wrap:wrap;gap:9px}.hidden{display:none!important}.alert{padding:11px;border-radius:10px;background:#fff2d8;font-size:13px;margin:10px 0}.preview{width:100%;background:#eee2d8;border-radius:14px;padding:12px;text-align:center}.preview canvas{width:100%;height:auto;max-width:595px;box-shadow:0 4px 20px #382d2433;background:white}.check{font-size:13px;background:#f7f3ee;border-radius:12px;padding:12px;line-height:1.8;margin-bottom:12px}.tip{font-size:13px;color:#766b63}#saveImg{display:block;max-width:100%;margin:10px auto;border:1px solid #eaded5;border-radius:8px} @media(max-width:520px){.fields{grid-template-columns:1fr}.wrap{padding:12px}.panel{padding:15px}}
</style></head><body><main class="wrap"><section class="panel"><h1>🌸 みろく流｜運気だより製造機</h1><p class="sub">2027年の年間テーマと、1〜3月の季節のメッセージ。鑑定書には数字も方位も載せません。</p><div class="fields"><div><label for="person">お名前</label><input id="person" placeholder="例：うめこ"></div><div><label for="birthday">生年月日</label><input id="birthday" type="date"></div><div><label for="override">本命星（通常は自動）</label><select id="override"><option value="">自動判定</option><option value="1">一白水星</option><option value="2">二黒土星</option><option value="3">三碧木星</option><option value="4">四緑木星</option><option value="5">五黄土星</option><option value="6">六白金星</option><option value="7">七赤金星</option><option value="8">八白土星</option><option value="9">九紫火星</option></select></div></div><div class="actions"><button id="generate">鑑定書を作成</button><button id="sample" class="secondary">うめこで検算</button></div><div id="alert" class="alert hidden"></div></section><section id="result" class="panel hidden"><h1>完成プレビュー</h1><div id="check" class="check"></div><div class="preview"><canvas id="paper" width="1240" height="1754"></canvas></div><div class="actions" style="margin-top:15px"><button id="save">鑑定書をPNGで保存</button></div><p class="tip">iPhoneで画像が開いたら長押しして「写真に保存」。画像はA4比率の高解像度PNGです。QRコードは印刷後に読み取り確認してな。</p><div id="saveArea" class="hidden"><p class="tip">保存できない場合は下の画像を長押しして保存してな。</p><img id="saveImg" alt="保存用の鑑定書"></div></section></main><script>
'use strict';
const $=id=>document.getElementById(id);
const themes={1:{t:'新しい一歩を大切に',a:'自分の気持ちに耳を傾けながら、できることから始めてみましょう。',b:'小さな挑戦をひとつ選んでみて。'},2:{t:'ゆっくり育てる時間',a:'人とのつながりや、続けてきたことを丁寧に育てる時間です。',b:'大切な人との会話を楽しんで。'},3:{t:'あなたらしさを表現して',a:'好きなことや心に浮かんだ思いを、少しずつ外へ届けてみましょう。',b:'嬉しかったことを言葉にしてみて。'},4:{t:'足元を整える季節',a:'暮らしや予定を見直すことで、安心して進める土台が育ちます。',b:'毎日の習慣をひとつ整えて。'},5:{t:'変化を味方に',a:'いつもと違う選択に、思いがけない気づきがあるかもしれません。',b:'気になっていたことを試してみて。'},6:{t:'大切なものを見つめて',a:'人や暮らしを思いやる時間を、自分自身にも向けてみましょう。',b:'自分をいたわる時間も忘れずに。'},7:{t:'心の声を聞くとき',a:'答えを急がず、学びや静かな時間から自分の気持ちを確かめて。',b:'ひとりで落ち着ける時間をつくって。'},8:{t:'積み重ねを形に',a:'続けてきた努力を振り返り、現実の形につなげていきましょう。',b:'これまでの成果を書き出してみて。'},9:{t:'心に余白をつくる',a:'今の自分に合わなくなったものを整理して、次の季節を迎える準備を。',b:'後回しのことをひとつ片づけて。'},11:{t:'小さな気づきを大切に',a:'ふと感じたことを見過ごさず、心に響くものを丁寧に確かめてみて。',b:'心が動いた瞬間をメモしてみて。'},22:{t:'思いを形に育てる',a:'大切にしてきた理想を、無理のない計画へと落とし込む時間です。',b:'目標をひとつ具体的にしてみて。'}};
const palaces=['C','NW','W','NE','S','N','SW','E','SE'];
const palaceWords={
C:{t:'心の軸を整える',s:'周りの声に急いで答えるより、まず自分が本当に望んでいることを確かめて。静かな時間が、次の選択をやさしく支えてくれます。',action:'予定を詰めすぎず、ひとりで考える時間をつくる'},
NW:{t:'自分で選ぶ勇気',s:'誰かの期待を全部背負わなくても大丈夫。大切なことから順に、自分の意思で決めていくことで気持ちが整いそうです。',action:'今の自分に必要なことを一つ選び直す'},
W:{t:'喜びを分かち合う',s:'頑張ることばかりに目を向けず、楽しい会話や小さな達成も味わって。気持ちを分かち合うことが、次の力につながります。',action:'うれしかった出来事を誰かに伝える'},
NE:{t:'節目を大切にする',s:'以前のやり方がしっくりこなくなったら、見直しの合図かもしれません。変えるものと残すものを、焦らず選んでいきましょう。',action:'続けたい習慣と手放したい習慣を書き出す'},
S:{t:'気づきを言葉にする',s:'今まで見過ごしていた自分の思いに気づきやすいとき。答えを急がず、感じたことを丁寧に言葉にすると進む方向が見えそうです。',action:'心に残ったことを短く書き留める'},
N:{t:'力を蓄える',s:'思うように進まない日があっても、立ち止まる時間には意味があります。無理に結果を求めず、心身を整えることを優先してみて。',action:'休む予定を先に一つ決める'},
SW:{t:'日々を育てる',s:'大きな変化より、いつもの暮らしを丁寧に重ねることが力になります。身近な人への思いやりと、自分へのいたわりを両方大切に。',action:'毎日続けられる小さな習慣を一つ選ぶ'},
E:{t:'小さく始める',s:'気になっていたことに、そっと一歩を踏み出すきっかけがありそう。完璧な準備を待たず、できる範囲から試してみましょう。',action:'温めていたアイデアを一つ試す'},
SE:{t:'ご縁を育てる',s:'人とのやり取りの中に、新しい視点が見つかるかもしれません。急いで関係を広げるより、今あるつながりを丁寧に育てて。',action:'気になっていた人に近況を伝える'}
};
function fusion(theme,palace){return `${theme.a} ${palace.s}`}

const sumDigits=s=>[...String(s)].reduce((a,c)=>a+(Number(c)||0),0);
function reduce(n){while(n>9&&n!==11&&n!==22)n=sumDigits(n);return n}
function root(n){while(n>9)n=sumDigits(n);return n}
function starFromYear(y){return ((11-root(y)-1+900)%9)+1}
function honmei(date){let [y,m,d]=date.split('-').map(Number),uncertain=false;if(m===1||(m===2&&d<=2))y--;else if(m===2&&(d===3||d===4)){uncertain=true;y--}return {star:starFromYear(y),uncertain}}
function startAt(date,year,month,day){const [by,bm,bd]=date.split('-').map(Number);return {y:year-((month<bm||(month===bm&&day<bd))?1:0),m:bm,d:bd}}
function base(s){return sumDigits(`${s.y}${String(s.m).padStart(2,'0')}${String(s.d).padStart(2,'0')}`)}
function yearN(s){return reduce(base(s))}function monthN(s,m){return reduce(base(s)+m)}
function pos(star,center){return palaces[(star-center+9)%9]}
function makeData(name,date,override){const h=honmei(date),star=override||h.star,annualStart=startAt(date,2027,1,1),annualEnd=startAt(date,2027,12,31);const months=[1,2,3].map((m,i)=>{const start=startAt(date,2027,m,1),end=startAt(date,2027,m,new Date(2027,m,0).getDate());return {m,n:monthN(start,m),endN:monthN(end,m),p:pos(star,[6,5,4][i])}});return {name,date,h,star,annualStart,annualEnd,year:yearN(annualStart),yearEnd:yearN(annualEnd),p:pos(star,9),months}}
const canvas=$('paper'),ctx=canvas.getContext('2d');const W=1240,H=1754;
function font(size,bold=false){ctx.font=`${bold?'700':'400'} ${size}px -apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic',sans-serif`}
function fill(text,x,y,size=28,color='#403732',bold=false){ctx.fillStyle=color;font(size,bold);ctx.fillText(text,x,y)}
function wrap(text,x,y,maxWidth,size=28,line=43,color='#403732',bold=false){ctx.fillStyle=color;font(size,bold);let cur='',yy=y;for(const ch of text){if(ctx.measureText(cur+ch).width>maxWidth&&cur){ctx.fillText(cur,x,yy);yy+=line;cur=''}cur+=ch}if(cur)ctx.fillText(cur,x,yy);return yy+line}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
const assetNames=['YUKIKO.PNG','MIROKUMAN.PNG','UMEKO.PNG','QR_YUKIKO.jpg','QR_369.jpg','QR_UMEKO.jpg'];const images={};async function loadAssets(){await Promise.all(assetNames.map(n=>new Promise(resolve=>{let img=new Image();img.onload=()=>{images[n]=img;resolve()};img.onerror=resolve;img.src=n})));}
function drawContain(img,x,y,w,h){if(!img)return;let r=Math.min(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*r,ih=img.naturalHeight*r;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function drawQR(img,x,y,size){if(!img)return; // QR image contains Instagram framing: crop central code, retain quiet zone
const sw=img.naturalWidth,sh=img.naturalHeight;const crop=Math.min(sw,sh)*0.53;const sx=(sw-crop)/2,sy=sh*0.39-crop/2;ctx.fillStyle='#fff';ctx.fillRect(x-5,y-5,size+10,size+10);ctx.drawImage(img,sx,Math.max(0,sy),crop,crop,x,y,size,size)}
function render(d){ctx.fillStyle='#fffdf9';ctx.fillRect(0,0,W,H);rounded(46,45,1148,155,20,'#f4ebe2');fill('みろく流  季節の運気だより',80,99,25,'#90715b',true);fill('2027年、あなたへのメッセージ',80,151,43,'#3c352f',true);fill(`${d.name} 様   ｜   1月・2月・3月号`,82,188,22,'#786d65');
const year=themes[d.year],yearPal=palaceWords[d.p];fill('2027年のテーマ',70,259,28,'#92735e',true);fill(`「${year.t}」`,70,317,43,'#493b34',true);
let annual=fusion(year,yearPal);if(d.year!==d.yearEnd){const [by,bm,bd]=d.date.split('-').map(Number);annual+=` ${bm}月${bd}日の誕生日からは「${themes[d.yearEnd].t}」という新しいテーマへ。少しずつ気持ちを切り替えていきましょう。`}
wrap(annual,72,372,1090,29,45);ctx.strokeStyle='#eaded3';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(70,525);ctx.lineTo(1170,525);ctx.stroke();
const monthStarts=[565,829,1093];d.months.forEach((m,i)=>{let y=monthStarts[i],n=themes[m.n],p=palaceWords[m.p];rounded(60,y,1120,242,18,i%2===0?'#f8f1eb':'#f4f5ed');fill(`${m.m}月`,84,y+54,38,'#775e4d',true);fill(n.t,216,y+54,33,'#453c35',true);let msg=`${n.a} ${p.s.split("。")[0]}。`;if(m.n!==m.endN){const bd=Number(d.date.slice(8));msg+=` 誕生日の${bd}日からは、少し違う流れも重なります。`}wrap(msg,86,y+109,1060,27,39);fill(`今月の一歩：${p.action}`,86,y+210,25,'#72806a',true)});
rounded(60,1362,1120,103,14,'#fff0eb');fill('みろく流から、最後にひと言',85,1402,27,'#8e685b',true);fill('この3か月の歩みが、次の季節のあなたを支えてくれますように。',85,1441,25,'#493d37');
ctx.strokeStyle='#e5d6ca';ctx.beginPath();ctx.moveTo(60,1492);ctx.lineTo(1180,1492);ctx.stroke();
const xs=[76,465,854];[['YUKIKO.PNG','QR_YUKIKO.jpg','ゆきこ'],['MIROKUMAN.PNG','QR_369.jpg','369イベント'],['UMEKO.PNG','QR_UMEKO.jpg','うめこ']].forEach((a,i)=>{const x=xs[i];drawContain(images[a[0]],x,1512,122,150);drawQR(images[a[1]],x+144,1542,96);fill(a[2],x+147,1665,21,'#6b5b52',true)});
fill('数秘術と九星気学をもとにした、みろく流の季節のメッセージです。未来を保証するものではありません。',62,1720,17,'#82766e');}
async function run(){const date=$('birthday').value,name=$('person').value.trim()||'お客さま';if(!date){alert('生年月日を入力してな');return}const ov=Number($('override').value)||0,d=makeData(name,date,ov);if(d.h.uncertain&&!ov){$('alert').textContent='立春前後の生まれ（2月3日・4日）は出生時刻による確認が必要です。本命星を資料で確認し、手動選択してください。';$('alert').classList.remove('hidden');$('result').classList.add('hidden');return}$('alert').classList.add('hidden');$('check').textContent=`管理用検算（印刷画像には出ません）｜本命星：${['','一白','二黒','三碧','四緑','五黄','六白','七赤','八白','九紫'][d.star]}｜年運 ${d.year} → ${d.yearEnd}｜1〜3月 ${d.months.map(m=>m.n+(m.n!==m.endN?'→'+m.endN:'')).join('・')}｜回座 年 ${d.p}／月 ${d.months.map(m=>m.p).join('・')}`;await loadAssets();render(d);$('result').classList.remove('hidden');$('saveArea').classList.add('hidden');$('result').scrollIntoView({behavior:'smooth'});}
$('generate').addEventListener('click',run);$('sample').addEventListener('click',()=>{$('person').value='うめこ';$('birthday').value='1976-10-15';$('override').value='';run()});$('save').addEventListener('click',()=>{let url=canvas.toDataURL('image/png');$('saveImg').src=url;$('saveArea').classList.remove('hidden');const a=document.createElement('a');a.href=url;a.download='みろく流_2027年運気だより.PNG';document.body.appendChild(a);a.click();a.remove();});
</script></body></html>
